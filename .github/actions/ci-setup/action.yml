name: CI setup
description: AWS, Docker, and Meedan service repos for check-web CI
inputs:
  profile:
    description: unit, integration, or similarity
    required: true
  aws-access-key-id:
    required: true
  aws-secret-access-key:
    required: true
  aws-role-to-assume:
    required: true
  decryption-password:
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        role-to-assume: ${{ inputs.aws-role-to-assume }}
        aws-region: eu-west-1

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Decrypt credentials for Alegre
      if: inputs.profile == 'similarity'
      shell: bash
      env:
        DECRYPTION_PASSWORD: ${{ inputs.decryption-password }}
      run: |
        set -euo pipefail
        openssl enc -aes-256-cbc -d \
          -in test/google_credentials.json.enc \
          -out test/google_credentials.json \
          -k "$DECRYPTION_PASSWORD"

    - name: Clone Meedan dependencies
      shell: bash
      env:
        CI_PROFILE: ${{ inputs.profile }}
        GITHUB_BRANCH: ${{ env.GITHUB_BRANCH }}
      run: |
        set -euo pipefail

        resolve_branch() {
          local repo="$1"
          local default_branch="$2"
          if git ls-remote --exit-code --heads "https://github.com/meedan/${repo}.git" "$GITHUB_BRANCH" >/dev/null 2>&1; then
            echo "$GITHUB_BRANCH"
          else
            echo "$default_branch"
          fi
        }

        clone_repo() {
          local repo="$1"
          local default_branch="$2"
          local branch
          branch="$(resolve_branch "$repo" "$default_branch")"
          echo "Using branch ${branch} for ${repo}"
          git clone --depth 1 --branch="$branch" "https://github.com/meedan/${repo}.git"
        }

        setup_pender() {
          clone_repo pender main
          cd pender
          cp config/config.yml.example config/config.yml
          cp config/database.yml.example config/database.yml
          cp config/sidekiq.yml.example config/sidekiq.yml
          cp config/cookies.txt.example config/cookies.txt
          cd -
        }

        setup_check_api() {
          clone_repo check-api develop
          cd check-api
          cp config/config.yml.example config/config.yml
          cp config/database.yml.example config/database.yml
          cp config/sidekiq.yml.example config/sidekiq.yml
          cd -
        }

        setup_alegre() {
          clone_repo alegre develop
          cd alegre
          cp .env_file.test .env_file
          if [ -f ../test/google_credentials.json ]; then
            cp ../test/google_credentials.json google_credentials.json
          fi
          cd -
        }

        setup_presto() {
          clone_repo presto master
          cd presto
          cp .env_file.test .env_file
          if [ -f ../test/google_credentials.json ]; then
            cp ../test/google_credentials.json google_credentials.json
          fi
          cd -
        }

        # docker-compose.yml references these env files for all services; compose
        # validates them even when only `web` is running.
        ensure_compose_env_files() {
          mkdir -p alegre presto
          if [ ! -f alegre/.env_file ]; then
            if [ -f alegre/.env_file.test ]; then
              cp alegre/.env_file.test alegre/.env_file
            else
              echo "# CI placeholder" > alegre/.env_file
            fi
          fi
          if [ ! -f presto/.env_file ]; then
            if [ -f presto/.env_file.test ]; then
              cp presto/.env_file.test presto/.env_file
            else
              echo "# CI placeholder" > presto/.env_file
            fi
          fi
        }

        case "$CI_PROFILE" in
          unit)
            setup_check_api
            ensure_compose_env_files
            ;;
          integration)
            setup_pender
            setup_check_api
            setup_alegre
            ensure_compose_env_files
            ;;
          similarity)
            setup_pender
            setup_check_api
            setup_alegre
            setup_presto
            ensure_compose_env_files
            ;;
          *)
            echo "Unknown CI profile: $CI_PROFILE"
            exit 1
            ;;
        esac

    - name: Setup configuration files
      shell: bash
      run: |
        set -euo pipefail
        cp config.js.example config.js
        cp config.js.example test/config.js
        cp config-build.js.example config-build.js
        cp config-server.js.example config-server.js
        cp test/config.yml.example test/config.yml
