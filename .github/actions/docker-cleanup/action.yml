name: Docker cleanup
description: Tear down compose stack and prune build cache for this job
runs:
  using: composite
  steps:
    - name: Cleanup Docker resources
      shell: bash
      run: |
        set +e
        echo "Cleaning up Docker resources for this workspace..."
        if [ -f docker-compose.yml ]; then
          docker compose -f docker-compose.yml -f docker-test.yml down -v --remove-orphans 2>/dev/null
        fi
        docker builder prune -af 2>/dev/null
        docker system prune -af --volumes 2>/dev/null
        echo "Disk after cleanup:"
        df -h / || true
