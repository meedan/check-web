name: Build Test and Deploy

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'

concurrency:
  group: ci-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-west-1
  DOCKER_BUILDKIT: 1

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        id: cache
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-deploy-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-deploy-${{ github.ref_name }}-
            ${{ runner.os }}-buildx-deploy-

      - name: Build and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ github.event.repository.name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          BRANCH=$(echo "${GITHUB_REF#refs/*/}" | sed 's/.*\///')
          docker buildx build \
            --cache-from "type=local,src=/tmp/.buildx-cache" \
            --cache-to "type=local,dest=/tmp/.buildx-cache,mode=max" \
            --push \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$BRANCH" \
            --file ./production/Dockerfile \
            --build-arg "DEPLOY_BRANCH=$BRANCH" \
            .
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

#    - name: Run Unit Tests
#      id: run-unit-tests

      - name: Kick off Terraform deploy in sysops/ for QA deployment
        id: sysops-deploy-qa
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/develop')
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.SYSOPS_RW_GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/meedan/sysops/actions/workflows/deploy_check_web.yml/dispatches \
            -d '{"ref": "master", "inputs": {"git_sha": "${{ github.sha }}", "type": "push"}}'

      - name: Kick off Terraform deploy in sysops/ for Live
        id: sysops-deploy-live
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.SYSOPS_RW_GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/meedan/sysops/actions/workflows/deploy_check_web.yml/dispatches \
            -d '{"ref": "master", "inputs": {"git_sha": "${{ github.sha }}", "type": "tag"}}'

      - name: Cleanup Docker resources
        if: always()
        timeout-minutes: 15
        continue-on-error: true
        uses: ./.github/actions/docker-cleanup
