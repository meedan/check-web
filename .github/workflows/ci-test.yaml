name: Build and Run Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - develop

concurrency:
  group: ci-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_BRANCH: ${{ github.head_ref || github.ref_name }}
  GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
  AWS_ENDPOINT: ${{ secrets.AWS_ENDPOINT }}
  AWS_REGION: eu-west-1
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  LANGUAGE: C.UTF-8
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  similarity-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: >
      github.ref == 'refs/heads/develop' ||
      github.ref == 'refs/heads/master' ||
      contains(github.event.head_commit.message, '[full ci]') ||
      contains(github.event.head_commit.message, '[media similarity tests]') ||
      contains(github.event.head_commit.message, '[text similarity tests]')
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Install ngrok
        uses: ./.github/actions/install-ngrok

      - name: CI setup
        uses: ./.github/actions/ci-setup
        with:
          profile: similarity
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          decryption-password: ${{ secrets.DECRYPTION_PASSWORD }}

      - name: Run media similarity tests
        id: media-similarity
        if: >
          github.ref == 'refs/heads/develop' ||
          github.ref == 'refs/heads/master' ||
          contains(github.event.head_commit.message, '[full ci]') ||
          contains(github.event.head_commit.message, '[media similarity tests]')
        env:
          NGROK_AUTH: ${{ secrets.NGROK_AUTH }}
          IMGUR_CLIENT_ID: ${{ secrets.IMGUR_CLIENT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          set -euo pipefail
          source .github/scripts/ci-common.sh
          run_similarity_phase media-similarity-tests

      - name: Tear down stack between similarity phases
        if: steps.media-similarity.outcome != 'skipped'
        run: |
          set -euo pipefail
          source .github/scripts/ci-common.sh
          teardown_compose_stack

      - name: Run text similarity tests
        if: >
          always() && (
            steps.media-similarity.outcome == 'success' ||
            steps.media-similarity.outcome == 'skipped' ||
            github.ref == 'refs/heads/develop' ||
            github.ref == 'refs/heads/master' ||
            contains(github.event.head_commit.message, '[text similarity tests]')
          )
        env:
          IMGUR_CLIENT_ID: ${{ secrets.IMGUR_CLIENT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          set -euo pipefail
          source .github/scripts/ci-common.sh
          run_similarity_phase text-similarity-tests

      - name: After similarity tests
        run: |
          docker compose exec web bash -c "[ -f test/file.json ] && python -m json.tool test/file.json || echo 'File does not exist'"
          size=$(du -k build/web/js/index.bundle.js | cut -f1)
          size2=$(du -k build/web/js/vendor.bundle.js | cut -f1)
          totalsize=$((size + size2))
          echo "Your bundle size is ${totalsize} kb"

      - name: Cleanup Docker resources
        if: always()
        timeout-minutes: 15
        continue-on-error: true
        uses: ./.github/actions/docker-cleanup

  integration-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: >
      github.ref == 'refs/heads/develop' ||
      github.ref == 'refs/heads/master' ||
      contains(github.event.head_commit.message, '[full ci]') ||
      contains(github.event.head_commit.message, '[smoke tests]')
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: CI setup
        uses: ./.github/actions/ci-setup
        with:
          profile: integration
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Start integration stack
        env:
          GITHUB_JOB_NAME: integration-and-unit-tests
        run: |
          set -euo pipefail
          source .github/scripts/ci-common.sh
          ./build.sh
          wait_for_url http://localhost:3333
          docker ps

      - name: Run linter
        run: |
          docker compose exec web npm run linter
          docker compose exec web npm run test:integration:lint

      - name: Run integration tests
        env:
          IMGUR_CLIENT_ID: ${{ secrets.IMGUR_CLIENT_ID }}
          GITHUB_JOB_NAME: integration-and-unit-tests
        run: |
          docker compose exec web service nginx start
          docker compose -f docker-compose.yml -f docker-test.yml exec chromedriver service nginx start
          docker compose exec -T \
            -e IMGUR_CLIENT_ID="$IMGUR_CLIENT_ID" \
            -e GITHUB_JOB_NAME=integration-and-unit-tests \
            -e GITHUB_BRANCH=${{ env.GITHUB_BRANCH }} \
            -e AWS_ENDPOINT=${{ secrets.AWS_ENDPOINT }} \
            -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            -e ROLE_TO_ASSUME=${{ secrets.AWS_ROLE_TO_ASSUME }} \
            -e AWS_REGION=eu-west-1 \
            -e TEST_RETRY_COUNT=3 \
            -e DEPLOY_ENV=ci \
            web npm run tests

      - name: After integration tests
        run: |
          docker compose exec web bash -c "[ -f test/file.json ] && python -m json.tool test/file.json || echo 'File does not exist'"
          size=$(du -k build/web/js/index.bundle.js | cut -f1)
          size2=$(du -k build/web/js/vendor.bundle.js | cut -f1)
          totalsize=$((size + size2))
          echo "Your bundle size is ${totalsize} kb"

      - name: Cleanup Docker resources
        if: always()
        timeout-minutes: 15
        continue-on-error: true
        uses: ./.github/actions/docker-cleanup

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >
      github.ref != 'refs/heads/develop' &&
      github.ref != 'refs/heads/master' &&
      !contains(github.event.head_commit.message, '[full ci]') &&
      !contains(github.event.head_commit.message, '[smoke tests]') &&
      !contains(github.event.head_commit.message, '[media similarity tests]') &&
      !contains(github.event.head_commit.message, '[text similarity tests]')
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: CI setup
        uses: ./.github/actions/ci-setup
        with:
          profile: unit
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Start unit test stack
        env:
          GITHUB_JOB_NAME: unit-tests
        run: |
          set -euo pipefail
          source .github/scripts/ci-common.sh
          ./build.sh
          wait_for_url http://localhost:3333
          docker ps

      - name: Run linter
        run: |
          docker compose exec web npm run linter
          docker compose exec web npm run test:integration:lint

      - name: Run unit tests
        run: |
          docker compose exec -T \
            -e GITHUB_JOB_NAME=unit-tests \
            web npm run tests

      - name: Cleanup Docker resources
        if: always()
        timeout-minutes: 15
        continue-on-error: true
        uses: ./.github/actions/docker-cleanup
