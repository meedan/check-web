name: Build and Run Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - develop

jobs:
  media-similarity-tests:
    runs-on: ubuntu-latest
    if: >
      github.ref == 'refs/heads/develop' ||
      github.ref == 'refs/heads/master' ||
      contains(github.event.head_commit.message, '[full ci]') ||
      contains(github.event.head_commit.message, '[media similarity tests]')
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run shared test setup
        uses: ./.github/actions/test-setup
        with:
          test_type: media-similarity-tests
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws_role_to_assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        env:
          GITHUB_BRANCH: ${{ github.head_ref || github.ref_name }}
          AWS_ENDPOINT: ${{ secrets.AWS_ENDPOINT }}
          DECRYPTION_PASSWORD: ${{ secrets.DECRYPTION_PASSWORD }}
          IMGUR_CLIENT_ID: ${{ secrets.IMGUR_CLIENT_ID }}
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: media-similarity-tests-artifacts
          path: |
            test/screenshots/**
            test/log/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Write job summary
        if: always()
        run: |
          echo "## CI Result Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Test type: media-similarity-tests" >> "$GITHUB_STEP_SUMMARY"
          echo "- Job result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Classification: heavy non-blocking check" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cleanup: best-effort teardown (non-blocking)" >> "$GITHUB_STEP_SUMMARY"

  text-similarity-tests:
    runs-on: ubuntu-latest
    if: >
      github.ref == 'refs/heads/develop' ||
      github.ref == 'refs/heads/master' ||
      contains(github.event.head_commit.message, '[full ci]') ||
      contains(github.event.head_commit.message, '[text similarity tests]')
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run shared test setup
        uses: ./.github/actions/test-setup
        with:
          test_type: text-similarity-tests
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws_role_to_assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        env:
          GITHUB_BRANCH: ${{ github.head_ref || github.ref_name }}
          AWS_ENDPOINT: ${{ secrets.AWS_ENDPOINT }}
          DECRYPTION_PASSWORD: ${{ secrets.DECRYPTION_PASSWORD }}
          IMGUR_CLIENT_ID: ${{ secrets.IMGUR_CLIENT_ID }}
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: text-similarity-tests-artifacts
          path: |
            test/screenshots/**
            test/log/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Write job summary
        if: always()
        run: |
          echo "## CI Result Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Test type: text-similarity-tests" >> "$GITHUB_STEP_SUMMARY"
          echo "- Job result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Classification: heavy non-blocking check" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cleanup: best-effort teardown (non-blocking)" >> "$GITHUB_STEP_SUMMARY"

  integration-and-unit-tests:
    runs-on: ubuntu-latest
    if: >
      github.ref == 'refs/heads/develop' ||
      github.ref == 'refs/heads/master' ||
      contains(github.event.head_commit.message, '[full ci]') ||
      contains(github.event.head_commit.message, '[smoke tests]')
    steps:
      - uses: actions/checkout@v4
      - name: Run shared test setup
        uses: ./.github/actions/test-setup
        with:
          test_type: integration-and-unit-tests
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws_role_to_assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        env:
          GITHUB_BRANCH: ${{ github.head_ref || github.ref_name }}
          AWS_ENDPOINT: ${{ secrets.AWS_ENDPOINT }}
          DECRYPTION_PASSWORD: ${{ secrets.DECRYPTION_PASSWORD }}
          IMGUR_CLIENT_ID: ${{ secrets.IMGUR_CLIENT_ID }}
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-and-unit-tests-artifacts
          path: |
            test/screenshots/**
            test/log/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Write job summary
        if: always()
        run: |
          echo "## CI Result Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Test type: integration-and-unit-tests" >> "$GITHUB_STEP_SUMMARY"
          echo "- Job result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Classification: blocking core check" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cleanup: best-effort teardown (non-blocking)" >> "$GITHUB_STEP_SUMMARY"

  unit-tests:
    runs-on: ubuntu-latest
    if: >
      github.ref != 'refs/heads/develop' &&
      github.ref != 'refs/heads/master' &&
      !contains(github.event.head_commit.message, '[full ci]') &&
      !contains(github.event.head_commit.message, '[smoke tests]') &&
      !contains(github.event.head_commit.message, '[media similarity tests]') &&
      !contains(github.event.head_commit.message, '[text similarity tests]')
    steps:
      - uses: actions/checkout@v4
      - name: Run shared test setup
        uses: ./.github/actions/test-setup
        with:
          test_type: unit-tests
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws_role_to_assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        env:
          GITHUB_BRANCH: ${{ github.head_ref || github.ref_name }}
          AWS_ENDPOINT: ${{ secrets.AWS_ENDPOINT }}
          DECRYPTION_PASSWORD: ${{ secrets.DECRYPTION_PASSWORD }}
          IMGUR_CLIENT_ID: ${{ secrets.IMGUR_CLIENT_ID }}
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-artifacts
          path: |
            test/screenshots/**
            test/log/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Write job summary
        if: always()
        run: |
          echo "## CI Result Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Test type: unit-tests" >> "$GITHUB_STEP_SUMMARY"
          echo "- Job result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Classification: blocking core check" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cleanup: best-effort teardown (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
